# Render.com deployment configuration
# Deploy backend as a free Python web service

services:
  - type: web
    name: bharat-nilm-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL_DIR
        value: /tmp/models
    healthCheckPath: /ping
    # Free tier: spins down after 15 min inactivity; cold-start re-trains models (~60 s)
